name: 調査（東三河のハナハナ店）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/survey*', '.github/workflows/survey.yml']
permissions:
  contents: write
concurrency:
  group: survey
  cancel-in-progress: false
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: 調査
        run: |
          if [ -f tools/survey.py ]; then python tools/survey.py; else python tools/survey_probe.py; fi
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/survey data/survey_juggler 2>/dev/null || git add -A data/survey
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "東三河調査の結果 $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 7; done
