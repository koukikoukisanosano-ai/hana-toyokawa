name: 調査（台データオンライン）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/probe_daidata.py', '.github/workflows/probe.yml']
permissions:
  contents: write
concurrency:
  group: probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/probe_daidata.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/debug
          git diff --cached --quiet && exit 0
          git commit -q -m "調査結果（台データオンライン）"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 5; done
